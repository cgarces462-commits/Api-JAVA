# Nombre de la aplicación
spring.application.name=demo

# Puerto del servidor web embebido (por defecto 8080)
server.port=8080

# ========================================================
# CONFIGURACIÓN DE BASE DE DATOS H2 (En Memoria para pruebas)
# ========================================================
# URL de conexión: Guarda los datos en memoria RAM mientras la app esté encendida
spring.datasource.url=jdbc:h2:mem:medicamentosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola web de H2 para visualizar tablas y datos en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ========================================================
# Actualiza automáticamente el esquema de las tablas según las clases @Entity
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL generadas en la consola/terminal
spring.jpa.show-sql=true
# Formatea el SQL para que sea legible en consola
spring.jpa.properties.hibernate.format_sql=true
